<html lang="it">

<style>
:root {
  --primary: #FF6600;
  --primary-dark: #E55A00;
  --primary-bg: #FFF3E0;
  --text: #0A2540;
  --text-secondary: #697386;
  --text-light: #9BA8B4;
  --border: #E3E8EE;
  --border-light: #EEF3F8;
  --bg: #F6F9FC;
  --bg-card: #ffffff;
  --success: #16a34a;
  --danger: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; font-size: 12px;
  display: flex; flex-direction: column; overflow: hidden;
}
body > .header,
body > .header.header {
  padding: 6px 16px !important;
  flex-shrink: 0;
}
body > .header h1,
body > .header.header h1 { font-size: 15px !important; }
body > .header .btn-back,
body > .header a[href*="dashboard"] { font-size: 11px !important; padding: 2px 4px !important; margin-top: 1px !important; }

body > .container.dp-page,
body > .container.dp-page.dp-page {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  max-width: none !important; width: auto !important;
  margin: 0 !important; padding: 6px 12px 8px !important;
}

/* Tab bar */
.tab-bar {
  display: flex; gap: 4px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 6px;
  flex-shrink: 0;
  align-self: flex-start;
}
.tab {
  background: transparent; border: none; color: var(--text-secondary);
  padding: 7px 16px; border-radius: 8px;
  font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: all .18s;
}
.tab:hover { color: var(--text); background: var(--border-light); }
.tab.active { background: var(--primary); color: #fff; }

.toolbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 5px 12px;
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; flex-shrink: 0;
}
.toolbar .date-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
.toolbar input[type="date"], .toolbar select { padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 11.5px; font-family: inherit; background: #fff; color: var(--text); }
.toolbar input[type="date"]:focus, .toolbar select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,102,0,.12); }
.toolbar .info-pill { padding: 3px 9px; font-size: 11px; display: inline-flex; align-items: center; gap: 8px; background: var(--primary-bg); color: var(--primary-dark); border-radius: 999px; font-weight: 600; }
.toolbar .date-block { display: flex; align-items: center; gap: 8px; }
.toolbar .spacer { flex: 1; }

.grid-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
}
.grid-wrap .scroll {
  overflow: auto;
  flex: 1; min-height: 0;
  padding: 8px;
}

/* Tabella pezzi (Day by Day) - invariata */
table.pezzi {
  display: inline-table;
  width: 622px; min-width: 622px; max-width: 622px;
  border-collapse: collapse;
  font-size: 11.5px; table-layout: fixed;
  --label-col-width: 270px;
  --operator-col-width: 88px;
}
table.pezzi col.col-label { width: var(--label-col-width); }
table.pezzi col.col-op { width: var(--operator-col-width); }
table.pezzi thead th {
  background: #fff !important; color: var(--text) !important;
  font-weight: 700 !important; font-size: 11.5px !important;
  padding: 4px 9px !important;
  border-bottom: 2px solid var(--border) !important;
  text-align: center !important; white-space: nowrap !important;
  position: sticky; top: 0; z-index: 2;
  line-height: 1.15 !important;
}
table.pezzi thead th.col-data {
  background: var(--primary) !important; color: #fff !important; font-size: 12.5px !important; text-align: center !important;
  letter-spacing: 0.02em !important;
}
table.pezzi thead th.col-label { text-align: left !important; width: var(--label-col-width); }
table.pezzi thead th.col-op {
  width: var(--operator-col-width); min-width: var(--operator-col-width); max-width: var(--operator-col-width);
}
table.pezzi tbody td {
  padding: 1px 9px !important;
  border-bottom: 1px solid var(--border-light) !important;
  text-align: center !important; vertical-align: middle !important;
  line-height: 1.15 !important; font-size: 11.5px !important; color: var(--text) !important;
}
table.pezzi tbody tr:hover { background: transparent !important; }
table.pezzi tbody td.cell-label {
  text-align: left !important; font-weight: 700 !important; font-size: 11.5px !important; color: var(--text) !important;
  font-style: italic !important; white-space: nowrap !important;
  width: var(--label-col-width);
  padding: 1px 14px 1px 9px !important;
}
table.pezzi tbody td.cell-num {
  font-weight: 700 !important; font-size: 12px !important;
  text-align: center !important;
  width: var(--operator-col-width);
  min-width: var(--operator-col-width);
  max-width: var(--operator-col-width);
}
table.pezzi tbody td.cell-num.zero { color: var(--text-light) !important; font-weight: 500 !important; }
table.pezzi tbody tr.gruppo-header td {
  background: #f1f5f9 !important; color: var(--text) !important;
  font-size: 10.5px !important; font-weight: 700 !important;
  text-transform: uppercase !important; letter-spacing: 0.06em !important;
  padding: 2px 9px !important;
  text-align: left !important; line-height: 1.2 !important;
}

/* Gare Individuali */
.gare-grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
}
.gara-card {
  background: #fff; border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden;
}
.gara-card-head {
  background: #C6F6D5; padding: 8px 12px; text-align: center;
  font-size: 13px; font-weight: 800; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text);
  border-bottom: 1px solid var(--border);
}
table.gara-tab { width: 100%; border-collapse: collapse; font-size: 12px; }
table.gara-tab thead th {
  background: var(--bg); font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  color: var(--text-secondary); letter-spacing: .04em;
  padding: 5px 8px; text-align: center;
  border-bottom: 1px solid var(--border);
}
table.gara-tab thead th:first-child { text-align: left; }
table.gara-tab tbody td {
  padding: 4px 8px; text-align: center; vertical-align: middle;
  border-bottom: 1px solid var(--border-light); font-size: 12px;
}
table.gara-tab tbody td.metrica {
  text-align: left; font-weight: 700; color: var(--text);
  border-right: 1px solid var(--border-light);
}
table.gara-tab tbody td.compenso { font-weight: 700; }
table.gara-tab tbody tr.tot td {
  background: #f1f5f9; font-weight: 800; font-size: 12.5px;
  text-transform: uppercase; letter-spacing: .04em;
}
table.gara-tab tbody tr.tot td.compenso-tot {
  background: #FFF9C4; color: var(--text);
}
.badge-dec { color: var(--danger); font-weight: 900; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
table.gara-tab tbody tr.clickable { cursor: pointer; }
table.gara-tab tbody tr.clickable:hover td { background: #FFF7ED; }
table.gara-tab tbody tr.clickable:hover td.metrica { filter: brightness(0.96); }
.mx-info-dot { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 10px; font-weight: 800; font-style: normal; margin-left: 6px; vertical-align: middle; font-family: Georgia, serif; }

/* Avanzamento Mensile */
.av-section { margin-bottom: 20px; }
.av-section h3 {
  font-size: 12px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .05em; color: var(--text-secondary);
  padding: 8px 4px 6px; border-bottom: 1px solid var(--border);
}
table.avanz { border-collapse: collapse; font-size: 12px; margin-top: 6px; table-layout: fixed; }
table.avanz thead th {
  background: var(--bg); font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  color: var(--text-secondary); letter-spacing: .04em;
  padding: 5px 8px; text-align: center;
  border-bottom: 1px solid var(--border);
}
table.avanz thead th.gr-pezzi { background: #FFF7ED; color: var(--primary-dark); }
table.avanz tbody td {
  padding: 4px 8px; text-align: center;
  border-bottom: 1px solid var(--border-light); font-size: 12px;
}
table.avanz tbody td.metrica {
  text-align: left; font-weight: 700; color: var(--text);
}
table.avanz tbody td.punteggio { font-weight: 700; background: #FEFCE8; }
table.avanz tbody td.eccedenza { font-weight: 800 !important; }
table.avanz tbody td.eccedenza.pos { color: var(--success) !important; }
table.avanz tbody td.eccedenza.neg { color: var(--danger) !important; }
table.avanz tbody td.andamento { font-weight: 800 !important; }
table.avanz tbody td.andamento.in-linea { color: var(--info) !important; }
table.avanz tbody td.andamento.in-ritardo { color: var(--danger) !important; }
table.avanz tbody td.andamento.raggiunto { color: var(--success) !important; }
table.avanz tbody tr.subheader td {
  background: var(--bg) !important; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  color: var(--text-secondary); letter-spacing: .04em;
  padding: 5px 8px; text-align: center;
  border-top: 1px solid var(--border) !important;
  border-bottom: 1px solid var(--border) !important;
}
table.avanz tbody td.empty-obanec { background: #ffffff !important; border: none !important; }
table.avanz thead th.empty-obanec { background: #ffffff !important; border: none !important; }

.empty-state { padding: 40px 20px; text-align: center; color: var(--text-secondary); }
.empty-state .empty-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.45; }
</style>

<script>
const sb = db;

// Colonne operatori HARDCODED per la Day by Day (compatibilita' col codice esistente).
const OPERATORI = ['MATTEO', 'MIRKO', 'FRANCESCA', 'CEREA'];
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

// Codice Rivenditore (migration 050): il Day by Day e l'Avanzamento Mensile
// conteggiano SOLO i contratti inseriti a Legnago (9001415852). La tab Gare
// Individuali invece include anche Cerea (9000822241) — la persona vede la
// produzione totale personale a prescindere dal punto vendita di inserimento.
const CODICE_LEGNAGO = '9001415852';

const DPState = {
  activeTab: 'day',
  dataSelezionata: null,        // Day by Day
  anno: null, mese: null,       // tab mensili
  righeDay: [],                 // dashboard_righe_giornaliera
  contrattiDay: [],
  metricheGara: [],             // gara_metriche
  operatoriInGara: [],          // profili in_gara=true
  operatoriAttiviMese: [],      // profili unici sui contratti del mese (per Avanzamento)
  obiettivi: [],                // gara_obiettivi_mensili del mese/anno
  contrattiMese: [],
  profiliMap: new Map(),
  loadedMonthKey: null          // 'YYYY-MM' per invalidare cache
};

// ============================================================
// UTIL
// ============================================================
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function normalizzaNome(s) { return String(s || '').trim().toUpperCase(); }
function isoOggi() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDataLabel(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  const mesi = ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
  return d.getDate() + ' ' + mesi[d.getMonth()];
}
function fmtEur(n) { if (n === null || n === undefined || isNaN(n)) return '-'; return '€ ' + Number(n).toLocaleString('it-IT', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

// ============================================================
// CALENDARIO — giorni lavorativi mese e giorni passati (per Andamento)
// ============================================================
// Pasqua (algoritmo di Gauss) → data domenica di Pasqua nell'anno
function pasquaData(anno) {
  const a = anno % 19;
  const b = Math.floor(anno / 100);
  const c = anno % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mese = Math.floor((h + l - 7 * m + 114) / 31);
  const giorno = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(anno, mese - 1, giorno);
}
// Set di date festive (formato Date.toDateString) per un anno
function festivitaItaliane(anno) {
  const feste = [
    [0, 1],   // 1 gennaio
    [0, 6],   // 6 gennaio
    [3, 25],  // 25 aprile
    [4, 1],   // 1 maggio
    [5, 2],   // 2 giugno
    [7, 15],  // 15 agosto
    [10, 1],  // 1 novembre
    [11, 8],  // 8 dicembre
    [11, 25], // 25 dicembre
    [11, 26]  // 26 dicembre
  ];
  const set = new Set(feste.map(([m, g]) => new Date(anno, m, g).toDateString()));
  // Pasquetta = giorno dopo Pasqua
  const pasqua = pasquaData(anno);
  const pasquetta = new Date(pasqua.getFullYear(), pasqua.getMonth(), pasqua.getDate() + 1);
  set.add(pasquetta.toDateString());
  return set;
}
// Un giorno e' lavorativo se non e' domenica e non e' una festa nazionale
function isGiornoLavorativo(d, feste) {
  if (d.getDay() === 0) return false; // domenica
  return !feste.has(d.toDateString());
}
// Conta i giorni lavorativi (lun-sab, escluse feste) di un intero mese
function giorniLavorativiMese(anno, mese1based) {
  const feste = festivitaItaliane(anno);
  const ultimoGiorno = new Date(anno, mese1based, 0).getDate();
  let n = 0;
  for (let g = 1; g <= ultimoGiorno; g++) {
    if (isGiornoLavorativo(new Date(anno, mese1based - 1, g), feste)) n++;
  }
  return n;
}
// Conta i giorni lavorativi gia' trascorsi nel mese, includendo OGGI.
// Se il mese/anno e' futuro rispetto a oggi -> 0.
// Se il mese/anno e' passato -> tutto il mese.
function giorniLavorativiPassati(anno, mese1based) {
  const oggi = new Date();
  const primaGiornoMese = new Date(anno, mese1based - 1, 1);
  const primaGiornoDopoMese = new Date(anno, mese1based, 1);
  if (oggi < primaGiornoMese) return 0;
  if (oggi >= primaGiornoDopoMese) return giorniLavorativiMese(anno, mese1based);
  const feste = festivitaItaliane(anno);
  let n = 0;
  for (let g = 1; g <= oggi.getDate(); g++) {
    if (isGiornoLavorativo(new Date(anno, mese1based - 1, g), feste)) n++;
  }
  return n;
}

// ============================================================
// MATCHING ENGINE (comune Day + Mensile)
// ============================================================
function matchRegola(contratto, regola) {
  if (!regola || typeof regola !== 'object') return true;
  // OR: se presente, ognuna delle sotto-regole viene valutata; basta che una matchi
  if (Array.isArray(regola.or) && regola.or.length) {
    return regola.or.some(sub => matchRegola(contratto, sub));
  }
  const c = contratto;
  const strEq = (got, want) => String(got || '').trim().toLowerCase() === String(want || '').trim().toLowerCase();
  const strInArr = (got, arr) => Array.isArray(arr) && arr.some(v => strEq(got, v));
  const reMatch = (got, pattern) => {
    if (!pattern) return true;
    try { return new RegExp(pattern, 'i').test(String(got || '')); } catch (e) { return false; }
  };
  if (regola.categoria && !strEq(c.categoria_snapshot, regola.categoria)) return false;
  if (regola.categoria_in && !strInArr(c.categoria_snapshot, regola.categoria_in)) return false;
  if (regola.cluster && !strEq(c.cluster_cliente, regola.cluster)) return false;
  if (regola.cluster_in && !strInArr(c.cluster_cliente, regola.cluster_in)) return false;
  if (regola.tipo_attivazione && !strEq(c.tipo_attivazione, regola.tipo_attivazione)) return false;
  if (regola.apri_chiudi && !strEq(c.apri_chiudi, regola.apri_chiudi)) return false;
  if (regola.intestatario && !strEq(c.intestatario, regola.intestatario)) return false;
  if (regola.switch_sim && !strEq(c.switch_sim, regola.switch_sim)) return false;
  if (regola.modalita_pagamento && !strEq(c.modalita_pagamento, regola.modalita_pagamento)) return false;
  if (regola.tipo_acquisto && !strEq(c.tipo_acquisto, regola.tipo_acquisto)) return false;
  if (regola.fascia_prezzo && !strEq(c.fascia_prezzo, regola.fascia_prezzo)) return false;
  if (regola.fascia_prezzo_in && !strInArr(c.fascia_prezzo, regola.fascia_prezzo_in)) return false;
  if (regola.finanziaria && !strEq(c.finanziaria, regola.finanziaria)) return false;
  if (regola.dispositivo_associato !== undefined && Boolean(c.dispositivo_associato) !== Boolean(regola.dispositivo_associato)) return false;
  if (regola.kolme !== undefined && Boolean(c.kolme) !== Boolean(regola.kolme)) return false;
  if (regola.reload_exchange !== undefined && Boolean(c.reload_exchange) !== Boolean(regola.reload_exchange)) return false;
  if (regola.offerta_match && !reMatch(c.nome_offerta_snapshot, regola.offerta_match)) return false;
  if (regola.offerta_not_match && reMatch(c.nome_offerta_snapshot, regola.offerta_not_match)) return false;
  if (regola.opzione_match && !reMatch(c.nome_opzione_snapshot, regola.opzione_match)) return false;
  if (regola.reload_match && !reMatch(c.nome_reload_snapshot, regola.reload_match)) return false;
  return true;
}

function operatoreContratto(contratto, profiliMap) {
  const id = contratto.operatore_id;
  if (!id) return null;
  const p = profiliMap.get(id);
  if (!p) return null;
  return normalizzaNome(p.nome);
}

// ============================================================
// COMPENSO — DSL scaglioni + bonus (allineato ad admin-gare)
// ============================================================
function calcolaCompenso(attuale, regola, contratti) {
  if (!regola || typeof regola !== 'object') return { euro: 0, label: '' };
  const attualeNum = Math.max(0, Number(attuale) || 0);
  const decSoglia = Number(regola.decurtazione_soglia) || 0;
  if (decSoglia > 0 && attualeNum < decSoglia) return { euro: 0, label: 'DECURTAZIONE' };
  if (regola.tipo === 'nessuno') return { euro: 0, label: regola.label || '' };
  if (regola.tipo === 'per_pezzo') {
    return { euro: attualeNum * (Number(regola.per_pezzo) || 0), label: regola.label || '' };
  }
  if (regola.tipo === 'per_pezzo_variabile') {
    if (!Array.isArray(contratti) || !regola.campo) return { euro: 0, label: '' };
    const casi = Array.isArray(regola.casi) ? regola.casi : [];
    let euro = 0;
    contratti.forEach(c => {
      const val = c[regola.campo];
      const caso = casi.find(k => String(k.valore || '').trim().toLowerCase() === String(val || '').trim().toLowerCase());
      euro += Number(caso?.importo || 0);
    });
    return { euro, label: regola.label || '' };
  }
  if (regola.tipo !== 'scaglioni') return { euro: 0, label: regola.label || '' };
  const scaglioni = Array.isArray(regola.scaglioni) ? regola.scaglioni : [];
  const bonus = Array.isArray(regola.bonus_soglie) ? regola.bonus_soglie : [];
  let totale = 0;
  scaglioni.forEach(s => {
    const modo = s.tipo_calcolo || 'per_pezzo';
    const importo = Number(s.importo ?? s.per_pezzo ?? 0);
    const da = Number(s.da || 0);
    if (modo === 'flat') {
      if (attuale >= da) totale += importo;
    } else {
      const a = (s.a === null || s.a === undefined || s.a === '') ? Infinity : Number(s.a);
      if (attuale > da) {
        const pezziNelloScaglione = Math.min(attuale, a) - da;
        if (pezziNelloScaglione > 0) totale += pezziNelloScaglione * importo;
      }
    }
  });
  bonus.forEach(b => { if (attuale >= Number(b.soglia || 0)) totale += Number(b.bonus || 0); });
  return { euro: totale, label: regola.label || '' };
}

async function caricaContrattiDelGiorno(dataIso) {
  const [y, m, d] = dataIso.split('-').map(Number);
  const nextUtc = new Date(Date.UTC(y, m - 1, d + 1));
  const nextIso = nextUtc.toISOString().slice(0, 10);
  const start = `${dataIso}T00:00:00.000Z`;
  const end   = `${nextIso}T00:00:00.000Z`;
  const { data, error } = await sb.from('vendita_contratti')
    .select(`
      id, operatore_id, cluster_cliente,
      categoria_snapshot, nome_offerta_snapshot, nome_opzione_snapshot, nome_reload_snapshot,
      tipo_attivazione, apri_chiudi, intestatario, switch_sim, modalita_pagamento,
      dispositivo_associato, tipo_acquisto, fascia_prezzo, finanziaria, kolme,
      reload_exchange, data_contratto, stato_controllo, stato_inserimento,
      codice_rivenditore
    `)
    .gte('data_contratto', start).lt('data_contratto', end);
  if (error) throw error;
  return data || [];
}

function renderGrigliaDay() {
  const righe = DPState.righeDay;
  const contratti = DPState.contrattiDay;
  const profiliMap = DPState.profiliMap;

  const conteggi = {};
  righe.forEach(r => { conteggi[r.id] = { __total: 0 }; OPERATORI.forEach(op => { conteggi[r.id][op] = 0; }); });
  let totaleGenerale = 0;

  contratti.forEach(c => {
    const opNome = operatoreContratto(c, profiliMap);
    if (!opNome || !OPERATORI.includes(opNome)) return;
    righe.forEach(r => {
      if (matchRegola(c, r.regola)) {
        conteggi[r.id][opNome] += 1;
        conteggi[r.id].__total += 1;
        totaleGenerale += 1;
      }
    });
  });

  const wrap = document.getElementById('pezziTable');
  if (!righe.length) { wrap.innerHTML = '<div class="empty-state"><div class="empty-icon"></div>Nessuna riga configurata.</div>'; return; }

  const opCols = OPERATORI.map(op => `<th class="col-op">${escapeHtml(op)}</th>`).join('');
  const colGroup = `<colgroup><col class="col-label">${OPERATORI.map(() => '<col class="col-op">').join('')}</colgroup>`;
  let html = `<table class="pezzi">${colGroup}<thead><tr>
    <th class="col-data col-label">${escapeHtml(fmtDataLabel(DPState.dataSelezionata))}</th>
    ${opCols}
  </tr></thead><tbody>`;

  let currentGruppo = null;
  righe.forEach(r => {
    if (r.gruppo !== currentGruppo) {
      html += `<tr class="gruppo-header"><td colspan="${OPERATORI.length + 1}">${escapeHtml(r.gruppo)}</td></tr>`;
      currentGruppo = r.gruppo;
    }
    const rowColor = r.colore_hex || '#f1f5f9';
    const tdCells = OPERATORI.map(op => {
      const v = conteggi[r.id][op];
      return `<td class="cell-num ${v === 0 ? 'zero' : ''}">${v === 0 ? '' : v}</td>`;
    }).join('');
    html += `<tr>
      <td class="cell-label" style="background:${escapeHtml(rowColor)};">${escapeHtml(r.nome)}</td>
      ${tdCells}
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  document.getElementById('infoRiepilogo').textContent = `Totale pezzi: ${totaleGenerale}`;
}

async function caricaDay() {
  const wrap = document.getElementById('pezziTable');
  wrap.innerHTML = '<div class="empty-state"><div class="empty-icon"></div>Caricamento...</div>';
  try {
    await caricaRigheDay();
    const contratti = await caricaContrattiDelGiorno(DPState.dataSelezionata);
    // Day by Day = solo Legnago (migration 050). I contratti inseriti da Cerea

    DPState.contrattiDay = contratti.filter(c =>

  }
}

// TAB MENSILI - Caricamento dati comune
// ============================================================
async function caricaDatiMensili() {
  const key = `${DPState.anno}-${String(DPState.mese).padStart(2,'0')}`;
  if (DPState.loadedMonthKey === key) return;

  const start = `${DPState.anno}-${String(DPState.mese).padStart(2,'0')}-01T00:00:00.000Z`;
  const mesePost = DPState.mese === 12 ? 1 : DPState.mese + 1;
  const annoPost = DPState.mese === 12 ? DPState.anno + 1 : DPState.anno;
  const end = `${annoPost}-${String(mesePost).padStart(2,'0')}-01T00:00:00.000Z`;

  const [rContratti, rMetriche, rObiettivi, rProfili] = await Promise.all([
    sb.from('vendita_contratti').select(`
        id, operatore_id, cluster_cliente,
        categoria_snapshot, nome_offerta_snapshot, nome_opzione_snapshot, nome_reload_snapshot,
        tipo_attivazione, apri_chiudi, intestatario, switch_sim, modalita_pagamento,
        dispositivo_associato, tipo_acquisto, fascia_prezzo, finanziaria, kolme,
        reload_exchange, data_contratto, stato_controllo, stato_inserimento,
        codice_rivenditore,
        punteggio_gara_offerta, punteggio_gara_opzione, punteggio_gara_totale,
        punteggio_extra_gara_offerta, punteggio_extra_gara_opzione, punteggio_extra_gara_totale,
        punteggio_offerta, punteggio_opzione, punteggio_totale
      `).gte('data_contratto', start).lt('data_contratto', end),
    sb.from('gara_metriche').select('*').eq('attiva', true).order('tabella').order('ordine'),
    sb.from('gara_obiettivi_mensili').select('*').eq('anno', DPState.anno).eq('mese', DPState.mese),
    sb.from('profili').select('id, nome, in_gara, alias_di, ordine_gara').eq('attivo', true).order('ordine_gara', { ascending: true, nullsFirst: false }).order('nome')
  ]);
  if (rContratti.error) throw rContratti.error;
  if (rMetriche.error) throw rMetriche.error;
  if (rObiettivi.error) throw rObiettivi.error;
  if (rProfili.error) throw rProfili.error;

  DPState.contrattiMese = (rContratti.data || []).filter(c => c.stato_inserimento !== 'reinserimento');

  // Stati post-vendita per i filtri Avanzamento (P.IVA + Energia/Fisso Standard).
  // Carichiamo per TUTTI i contratti Fisso/Energia/Allarmi del mese (senza filtro cluster)
  // perche' i filtri Standard coprono anche i cluster non-Business.
  const contrattiPostVenditaIds = DPState.contrattiMese
    .filter(c => ['Fisso','Energia','Allarmi'].includes(c.categoria_snapshot))
    .map(c => c.id);
  DPState.statoPostVendita = { fisso: new Map(), energia: new Map(), allarmi: new Map() };
  DPState.tecnologiaFisso = new Map();
  if (contrattiPostVenditaIds.length) {
    const [rFisso, rLg, rAll] = await Promise.all([
      sb.from('post_vendita_controllo_fissi').select('contratto_id, stato, tecnologia').in('contratto_id', contrattiPostVenditaIds),
      sb.from('post_vendita_controllo_lg').select('contratto_id, stato').in('contratto_id', contrattiPostVenditaIds),
      sb.from('post_vendita_controllo_allarmi').select('contratto_id, stato').in('contratto_id', contrattiPostVenditaIds)
    ]);
    (rFisso.data || []).forEach(r => {
      DPState.statoPostVendita.fisso.set(r.contratto_id, r.stato);
      DPState.tecnologiaFisso.set(r.contratto_id, r.tecnologia);
    });
    (rLg.data || []).forEach(r => DPState.statoPostVendita.energia.set(r.contratto_id, r.stato));
    (rAll.data || []).forEach(r => DPState.statoPostVendita.allarmi.set(r.contratto_id, r.stato));
  }

  // FTTC attivati nel mese (indipendentemente dal mese del contratto).
  // Per la riga FISSI dell'Avanzamento Standard: i FTTC contano SOLO se stato=Attivo
  // e SOLO nel mese di data_attivazione. Caricamento separato perche' data_contratto
  // puo' essere di un mese diverso.
  DPState.fissoFTTCAttivatiMese = [];
  const rFttcPv = await sb.from('post_vendita_controllo_fissi')
    .select('contratto_id')
    .eq('tecnologia', 'FTTC')
    .eq('stato', 'Attivo')
    .gte('data_attivazione', `${DPState.anno}-${String(DPState.mese).padStart(2,'0')}-01`)
    .lt('data_attivazione', `${annoPost}-${String(mesePost).padStart(2,'0')}-01`);
  const fttcIds = (rFttcPv.data || []).map(r => r.contratto_id);
  if (fttcIds.length) {
    const rFttcContr = await sb.from('vendita_contratti')
      .select('id, operatore_id, cluster_cliente, categoria_snapshot, data_contratto, stato_inserimento, punteggio_gara_totale, codice_rivenditore')
      .in('id', fttcIds);
    // FTTC attivati nel mese usati solo nell'Avanzamento Mensile -> filtro Legnago (migration 050).
    DPState.fissoFTTCAttivatiMese = (rFttcContr.data || []).filter(c =>
      c.stato_inserimento !== 'reinserimento' && c.codice_rivenditore === CODICE_LEGNAGO
    );
  }
  DPState.metricheGara = rMetriche.data || [];
  DPState.obiettivi = rObiettivi.data || [];
  const profiliMap = new Map();
  (rProfili.data || []).forEach(p => profiliMap.set(p.id, p));
  DPState.profiliMap = profiliMap;
  // Solo profili canonici (esclude alias) — il DB gia' redirige gli operatore_id via trigger,
  // ma la lista operatori la teniamo pulita anche a UI.
  const canonici = (rProfili.data || []).filter(p => !p.alias_di);
  DPState.operatoriInGara = canonici.filter(p => p.in_gara);

  // Operatori attivi nel mese (per l'Avanzamento Mensile): union in_gara + chi ha contratti
  // LEGNAGO (migration 050) nel mese, risolti al canonico se un contratto storico non e' ancora
  // stato backfillato. Include anche gli operatori di FTTC attivati Legnago nel mese.
  const opConContratti = new Set(
    DPState.contrattiMese
      .filter(c => c.codice_rivenditore === CODICE_LEGNAGO)
      .map(c => DPState.resolveOperatore(c.operatore_id))
      .filter(Boolean)
  );
  DPState.fissoFTTCAttivatiMese.forEach(c => {
    const op = DPState.resolveOperatore(c.operatore_id);
    if (op) opConContratti.add(op);
  });
  const opIds = new Set([...DPState.operatoriInGara.map(p => p.id), ...opConContratti]);
  DPState.operatoriAttiviMese = Array.from(opIds)
    .map(id => profiliMap.get(id))
    .filter(p => p && !p.alias_di)
    .sort((a, b) => (a.ordine_gara ?? 0) - (b.ordine_gara ?? 0) || String(a.nome || '').localeCompare(String(b.nome || '')));

  DPState.loadedMonthKey = key;
}

// Risolve operatore_id → id canonico (segue alias_di, max 3 hop) usando la profiliMap gia' caricata
DPState.resolveOperatore = function(id) {
  if (!id) return null;
  let cur = id;
  for (let i = 0; i < 3; i++) {
    const p = DPState.profiliMap.get(cur);
    if (!p || !p.alias_di) return cur;
    cur = p.alias_di;
  }
  return cur;
};

function getObiettivoMese(metricaId, operatoreId) {
  return DPState.obiettivi.find(o => o.metrica_id === metricaId && (o.operatore_id || null) === (operatoreId || null)) || null;
}
function contrattiMatchPerOperatore(metrica, operatoreId) {
  return DPState.contrattiMese.filter(c => DPState.resolveOperatore(c.operatore_id) === operatoreId && matchRegola(c, metrica.regola));
}
function contrattiMatchTotali(metrica) {
  return DPState.contrattiMese.filter(c => matchRegola(c, metrica.regola));
}
// Varianti "Legnago-only" per l'Avanzamento Mensile (migration 050). Le funzioni
// senza suffisso restano usate dalla tab Gare Individuali, che conteggia entrambi
// i punti vendita perche' l'operatore vede la propria produzione totale.
function contrattiMatchPerOperatoreLegnago(metrica, operatoreId) {
  return DPState.contrattiMese.filter(c =>
    c.codice_rivenditore === CODICE_LEGNAGO
    && DPState.resolveOperatore(c.operatore_id) === operatoreId
    && matchRegola(c, metrica.regola)
  );
}
// Peso del singolo contratto per una regola: base 1 + eventuali bonus_conteggio
function pesoContratto(contratto, regola) {
  if (!matchRegola(contratto, regola)) return 0;
  let peso = 1;
  const bonus = (regola && Array.isArray(regola.bonus_conteggio)) ? regola.bonus_conteggio : [];
  bonus.forEach(b => {
    const sub = Object.assign({}, b);
    delete sub.peso;
    if (matchRegola(contratto, sub)) peso += Number(b.peso || 0);
  });
  return peso;
}
function contaConPesi(contratti, metrica) {
  let n = 0;
  contratti.forEach(c => { n += pesoContratto(c, metrica.regola); });
  return n;
}
// Somma una colonna punteggio (es. punteggio_gara_totale) su una lista di contratti
function sommaCampoPunteggio(contratti, campo) {
  let tot = 0;
  contratti.forEach(c => { tot += Number(c[campo] || 0); });
  return tot;
}
function contaMatchPerOperatore(metrica, operatoreId) {
  return contaConPesi(contrattiMatchPerOperatore(metrica, operatoreId), metrica);
}
function contaMatchTotale(metrica) {
  return contaConPesi(contrattiMatchTotali(metrica), metrica);
}

// Filtro post-vendita per Avanzamento P.IVA / Extra Gara P.IVA:
// Fisso   -> stato IN ('In Attivazione','Attivo')
// Energia -> stato != 'Rifiutato' (NULL ammesso)
// Allarmi -> stato = 'OK'
// Altre categorie -> sempre valido
function isContrattoValidoAvanzamentoPiva(c) {
  const cat = c.categoria_snapshot;
  if (cat === 'Fisso') {
    const s = DPState.statoPostVendita?.fisso.get(c.id);
    return s === 'In Attivazione' || s === 'Attivo';
  }
  if (cat === 'Energia') {
    const s = DPState.statoPostVendita?.energia.get(c.id);
    return s !== 'Rifiutato';
  }
  if (cat === 'Allarmi') {
    const s = DPState.statoPostVendita?.allarmi.get(c.id);
    return s === 'OK';
  }
  return true;
}

    let totCompenso = 0;
    let bodyHtml = '';
    metriche.forEach(m => {
      const conteggioSquadra = m.tipo_conteggio === 'squadra';
      const compensoSquadra = m.tipo_compenso === 'squadra';
      const contrattiMatched = conteggioSquadra ? contrattiMatchTotali(m) : contrattiMatchPerOperatore(m, op.id);
      const attuale = contaConPesi(contrattiMatched, m);

          <td class="metrica" style="background:${escapeHtml(m.colore_hex)}">${nomeCol}</td>

          <td>${obiettivo}</td>
          <td class="compenso"><span class="badge-dec">${escapeHtml(c.label)}</span></td>

        totCompenso += c.euro;
        bodyHtml += `<tr${rowAttr}>
          <td class="metrica" style="background:${escapeHtml(m.colore_hex)}">${nomeCol}</td>
          <td>${attuale}</td>
          <td>${obiettivo}</td>
          <td class="compenso">${fmtEur(c.euro)}</td>
        </tr>`;
      }

      <div class="gara-card-head">Gara ${escapeHtml(op.nome)}</div>

        <tbody>${bodyHtml}
          <tr class="tot"><td colspan="3">Totale compensi</td><td class="compenso compenso-tot">${fmtEur(totCompenso)}</td></tr>
        </tbody>
      </table>
    </div>`;
  });

}

function renderAvanzamento() {
  const wrap = document.getElementById('tabContentAvanzamento');
  const operatori = DPState.operatoriAttiviMese;
  if (!DPState.metricheGara.length) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon"></div>Nessuna metrica configurata.</div>';
    return;
  }
  // Le righe "Extra Gara P.IVA" sono state accorpate visivamente sotto le P.IVA:
  // stessa tabella, stesse colonne. Ordinamento: prima le avanzamento_piva per
  // ordine ASC, poi le avanzamento_extra_piva per ordine ASC.
  const priorita = { avanzamento_piva: 1, avanzamento_extra_piva: 2 };
  const metrichePiva = DPState.metricheGara
    .filter(m => m.tabella === 'avanzamento_piva' || m.tabella === 'avanzamento_extra_piva')
    .sort((a, b) => (priorita[a.tabella] - priorita[b.tabella]) || (a.ordine - b.ordine));
  const sezioni = [
    { key: 'standard', titolo: 'Avanzamento', metriche: DPState.metricheGara.filter(m => m.tabella === 'avanzamento_standard') },
    { key: 'piva',     titolo: 'Avanzamento P.IVA', metriche: metrichePiva }
  ];
  let html = '';
  let totaleContratti = 0;
  sezioni.forEach(sez => {
    const metriche = sez.metriche;
    if (!metriche.length) return;
    html += `<div class="av-section"><h3>${escapeHtml(sez.titolo)}</h3>`;
    const opHeaders = operatori.map(op => `<th class="gr-pezzi" style="width:88px">${escapeHtml(op.nome)}</th>`).join('');
    const totalWidth = 220 + (88 * operatori.length) + 420; // metrica + ops + (120+100+100+100)
    // Nella sezione P.IVA le intestazioni Obiettivo/Andamento/Eccedenza vengono
    // spostate in una sotto-intestazione posizionata subito sopra la prima riga
    // di tipo "avanzamento_extra_piva" (unica riga che le utilizza).
    const isPiva = sez.key === 'piva';
    const headerObAnEc = isPiva
      ? `<th class="empty-obanec" style="width:100px"></th><th class="empty-obanec" style="width:100px"></th><th class="empty-obanec" style="width:100px"></th>`
      : `<th style="width:100px">Obiettivo</th><th style="width:100px">Andamento</th><th style="width:100px">Eccedenza</th>`;
    html += `<table class="avanz" style="width:${totalWidth}px;min-width:${totalWidth}px;max-width:${totalWidth}px"><thead><tr>
      <th style="width:220px">Categorie</th>
      ${opHeaders}
      <th style="width:120px">Punteggio</th>
      ${headerObAnEc}
    </tr></thead><tbody>`;
    let subheaderExtraInserted = false;
    // Per le metriche Avanzamento P.IVA (individuali + Extra Gara) applichiamo il
    // filtro post-vendita sui contratti Business (Fisso/Energia/Allarmi) e usiamo
    // punteggio_extra_gara_totale come valore della colonna Punteggio.
    const usaFiltroExtraPiva = sez.key === 'piva';
    // Nella sezione Standard alcune categorie usano una colonna punteggio dedicata
    // invece del semplice conteggio pezzi (Assicurazioni -> punteggio_gara_totale,
    // Fisso -> punteggio_gara_totale).
    const CAMPO_PUNTEGGIO_STANDARD = { 'Assicurazioni': 'punteggio_gara_totale', 'Fisso': 'punteggio_gara_totale' };
    metriche.forEach(m => {
      // Avanzamento Mensile = solo contratti Legnago (migration 050).
      let contrattiPerOp = operatori.map(op => contrattiMatchPerOperatoreLegnago(m, op.id));
      if (usaFiltroExtraPiva) {
        contrattiPerOp = contrattiPerOp.map(list => list.filter(isContrattoValidoAvanzamentoPiva));
      } else if (sez.key === 'standard' && m.regola?.categoria === 'Energia') {
        // Avanzamento Standard - Luce & Gas: escludi contratti con post_vendita_controllo_lg.stato = 'Rifiutato'
        contrattiPerOp = contrattiPerOp.map(list => list.filter(c => DPState.statoPostVendita?.energia.get(c.id) !== 'Rifiutato'));
      } else if (sez.key === 'standard' && m.regola?.categoria === 'Allarmi') {
        // Avanzamento Standard - W3 PROTETTI: conta solo con stato IN Attivazione o OK
        contrattiPerOp = contrattiPerOp.map(list => list.filter(c => {
          const s = DPState.statoPostVendita?.allarmi.get(c.id);
          return s === 'In Attivazione' || s === 'OK';
        }));
      } else if (sez.key === 'standard' && m.regola?.categoria === 'Fisso') {
        // Avanzamento Standard - Fissi: (a) escludi FTTC del mese e contratti con stato != 'Attivo'/'In Attivazione'
        // (b) aggiungi FTTC attivati nel mese (indipendentemente da data_contratto) con stato='Attivo'
        contrattiPerOp = contrattiPerOp.map((list, i) => {
          const opId = operatori[i].id;
          const nonFttc = list.filter(c => {
            const stato = DPState.statoPostVendita?.fisso.get(c.id);
            const tecno = DPState.tecnologiaFisso?.get(c.id);
            if (tecno === 'FTTC') return false; // FTTC gestiti separatamente
            return stato === 'Attivo' || stato === 'In Attivazione';
          });
          const fttcAttivati = (DPState.fissoFTTCAttivatiMese || []).filter(c =>
            DPState.resolveOperatore(c.operatore_id) === opId
          );
          return [...nonFttc, ...fttcAttivati];
        });
      }
      const conteggi = contrattiPerOp.map(list => contaConPesi(list, m));
      const attuale = conteggi.reduce((a,b)=>a+b, 0);
      totaleContratti += attuale;
      // Punteggio:
      // (a) Avanzamento P.IVA -> somma punteggio_extra_gara_totale sui contratti filtrati
      // (b) Avanzamento Standard con categoria in CAMPO_PUNTEGGIO_STANDARD -> somma quella colonna
      // (c) metrica con punteggio_campo -> somma quella colonna
      // (d) fallback -> conteggio pezzi
      const campoStandard = (sez.key === 'standard' && m.regola?.categoria) ? CAMPO_PUNTEGGIO_STANDARD[m.regola.categoria] : null;
      let punteggio;
      if (usaFiltroExtraPiva) {
        punteggio = contrattiPerOp.reduce((tot, list) => tot + sommaCampoPunteggio(list, 'punteggio_extra_gara_totale'), 0);
      } else if (campoStandard) {
        punteggio = contrattiPerOp.reduce((tot, list) => tot + sommaCampoPunteggio(list, campoStandard), 0);
      } else if (m.punteggio_campo) {
        punteggio = contrattiPerOp.reduce((tot, list) => tot + sommaCampoPunteggio(list, m.punteggio_campo), 0);
      } else {
        punteggio = attuale;
      }
      const o = getObiettivoMese(m.id, null);
      const obiettivo = o?.obiettivo ?? 0;
      // Andamento: confronto punteggio corrente vs target proporzionale ai giorni lavorativi passati.
      // giorno_target = obiettivo / giorni_lav_mese; target_atteso = giorno_target * giorni_lav_passati.
      // punteggio >= target_atteso -> IN LINEA (verde), altrimenti IN RITARDO (rosso).
      // Eccedenza: (punteggio - target_atteso) arrotondato per eccedenza (verso l'esterno):
      //   +1.2 -> +2, -1.2 -> -2. Coerente col principio "sprona": mostra sempre il peggio/meglio.
      let andCls = '', andTxt = '-';
      let eccCls = '', eccTxt = '';
      if (obiettivo > 0) {
        const giorniTot = giorniLavorativiMese(DPState.anno, DPState.mese);
        const giorniPassati = giorniLavorativiPassati(DPState.anno, DPState.mese);
        if (giorniTot > 0) {
          const targetAtteso = (obiettivo / giorniTot) * giorniPassati;
          const diff = punteggio - targetAtteso;
          // Priorita': RAGGIUNTO (verde) > IN LINEA (azzurro) > IN RITARDO (rosso)
          if (punteggio >= obiettivo) { andCls = 'raggiunto'; andTxt = 'RAGGIUNTO'; }
          else if (diff >= 0) { andCls = 'in-linea'; andTxt = 'IN LINEA'; }
          else { andCls = 'in-ritardo'; andTxt = 'IN RITARDO'; }
          const eccAssoluto = Math.ceil(Math.abs(diff));
          if (eccAssoluto === 0) { eccTxt = '0'; }
          else if (diff > 0) { eccCls = 'pos'; eccTxt = '+' + eccAssoluto; }
          else { eccCls = 'neg'; eccTxt = '-' + eccAssoluto; }
        }
      }
      const opCells = conteggi.map(v => `<td>${v || ''}</td>`).join('');
      const isExtraPivaRow = isPiva && m.tabella === 'avanzamento_extra_piva';
      const hideObAnEc = isPiva && m.tabella === 'avanzamento_piva';
      if (isExtraPivaRow && !subheaderExtraInserted) {
        const emptyOps = operatori.map(() => '<td></td>').join('');
        html += `<tr class="subheader">
          <td></td>
          ${emptyOps}
          <td></td>
          <td>Obiettivo</td>
          <td>Andamento</td>
          <td>Eccedenza</td>
        </tr>`;
        subheaderExtraInserted = true;
      }
      html += `<tr>
        <td class="metrica" style="background:${escapeHtml(m.colore_hex)}">${escapeHtml(m.nome)}</td>
        ${opCells}
        <td class="punteggio">${punteggio.toLocaleString('it-IT', {minimumFractionDigits:0, maximumFractionDigits:2})}</td>
        ${hideObAnEc
          ? `<td class="empty-obanec"></td><td class="empty-obanec"></td><td class="empty-obanec"></td>`
          : `<td>${obiettivo || '-'}</td>
             <td class="andamento ${andCls}">${andTxt}</td>
             <td class="eccedenza ${eccCls}">${eccTxt}</td>`}
      </tr>`;
    });
    html += '</tbody></table></div>';
  });
  wrap.innerHTML = html;
  document.getElementById('infoRiepilogo').textContent = `${MESI[DPState.mese-1]} ${DPState.anno} · ${totaleContratti} pezzi`;
}

// ============================================================
// TAB SWITCH
// ============================================================
async function switchTab(name) {
  DPState.activeTab = name;
  document.querySelectorAll('#tabBar .tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.getElementById('tabContentDay').style.display = name === 'day' ? 'block' : 'none';
  document.getElementById('tabContentGare').style.display = name === 'gare' ? 'block' : 'none';
  document.getElementById('tabContentAvanzamento').style.display = name === 'avanzamento' ? 'block' : 'none';
  document.getElementById('dayToolbar').style.display = name === 'day' ? 'flex' : 'none';
  document.getElementById('monthToolbar').style.display = name === 'day' ? 'none' : 'flex';

  if (name === 'day') {
    await caricaDay();
  } else {
    const wrapGare = document.getElementById('tabContentGare');
    const wrapAv = document.getElementById('tabContentAvanzamento');
    if (name === 'gare') wrapGare.innerHTML = '<div class="empty-state"><div class="empty-icon"></div>Caricamento...</div>';
    if (name === 'avanzamento') wrapAv.innerHTML = '<div class="empty-state"><div class="empty-icon"></div>Caricamento...</div>';
    try {
      await caricaDatiMensili();
      if (name === 'gare') renderGare(); else renderAvanzamento();
    } catch (e) {
      console.error(e);
      const wrap = name === 'gare' ? wrapGare : wrapAv;
      wrap.innerHTML = `<div class="empty-state"><div class="empty-icon"></div>Errore: ${escapeHtml(e.message)}</div>`;
    }
  }
}

// ============================================================
// INIT
// ============================================================
(function init() {
  const now = new Date();
  DPState.dataSelezionata = isoOggi();
  DPState.anno = now.getFullYear();
  DPState.mese = now.getMonth() + 1;

  document.getElementById('dataPezzi').value = DPState.dataSelezionata;
  document.getElementById('dataPezzi').addEventListener('change', (e) => {
    DPState.dataSelezionata = e.target.value || isoOggi();
    if (DPState.activeTab === 'day') caricaDay();
  });

  const selMese = document.getElementById('selMese');
  selMese.innerHTML = MESI.map((m, i) => `<option value="${i+1}" ${(i+1===DPState.mese)?'selected':''}>${m}</option>`).join('');
  const selAnno = document.getElementById('selAnno');
  const anni = []; for (let a = DPState.anno + 1; a >= DPState.anno - 3; a--) anni.push(a);
  selAnno.innerHTML = anni.map(a => `<option value="${a}" ${a===DPState.anno?'selected':''}>${a}</option>`).join('');
  const changeMese = async () => {
    DPState.mese = Number(selMese.value); DPState.anno = Number(selAnno.value);
    DPState.loadedMonthKey = null;
    if (DPState.activeTab !== 'day') switchTab(DPState.activeTab);
  };
  selMese.addEventListener('change', changeMese);
  selAnno.addEventListener('change', changeMese);

  document.querySelectorAll('#tabBar .tab').forEach(b => {
    b.addEventListener('click', () => switchTab(b.dataset.tab));
  });

  switchTab('day');
})();
</script>
