<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imposta password - Mirox CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/mirox-safe.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/logo.png" alt="Mirox CRM" style="width:200px">
      </div>

      <div id="loadingPanel">
        <p class="login-title">Verifica dell'invito in corso</p>
        <p style="color: var(--text-secondary);">Attendi qualche secondo.</p>
      </div>

      <div id="passwordPanel" class="hidden">
        <p class="login-title">Imposta la tua password</p>
        <p id="accountEmail" style="margin-bottom: 20px; color: var(--text-secondary);"></p>
        <div id="alertBox"></div>
        <form id="passwordForm" style="text-align: left;">
          <div class="form-group">
            <label class="form-label" for="newPassword">Nuova password</label>
            <input type="password" id="newPassword" class="form-control" minlength="12" required autocomplete="new-password" placeholder="Almeno 12 caratteri">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Conferma password</label>
            <input type="password" id="confirmPassword" class="form-control" minlength="12" required autocomplete="new-password" placeholder="Ripeti la password">
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-full" id="btnSavePassword" style="justify-content: center;">
            <span id="btnSaveText">Salva password</span>
            <span id="btnSaveSpinner" class="hidden">Salvataggio in corso...</span>
          </button>
        </form>
      </div>

      <div id="invalidPanel" class="hidden">
        <p class="login-title">Invito non valido</p>
        <div class="alert alert-danger" id="invalidMessage">Il link e' scaduto o non e' valido. Richiedi un nuovo invito.</div>
        <a href="index.html" class="btn btn-secondary w-full" style="justify-content: center; margin-top: 16px;">Torna al login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js" integrity="sha384-Tve8O+C6PBzsIMK/IRCwHbi8fyEzXIlIs6OfVBZHubplwYhaQF/4Mzxqgg+pp/oy" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script>
    const loadingPanel = document.getElementById('loadingPanel');
    const passwordPanel = document.getElementById('passwordPanel');
    const invalidPanel = document.getElementById('invalidPanel');

    function getAuthParams() {
      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      return { query, hash };
    }

    async function resolveInviteSession() {
      const { query, hash } = getAuthParams();
      const providerError = query.get('error_description') || hash.get('error_description');
      if (providerError) throw new Error(providerError);

      let result;
      const tokenHash = query.get('token_hash');
      const authType = query.get('type');
      const code = query.get('code');
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');

      if (tokenHash && ['invite', 'recovery'].includes(authType)) {
        result = await db.auth.verifyOtp({ token_hash: tokenHash, type: authType });
      } else if (code) {
        result = await db.auth.exchangeCodeForSession(code);
      } else if (accessToken && refreshToken) {
        result = await db.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
      } else {
        result = await db.auth.getSession();
      }

      if (result.error) throw result.error;
      const session = result.data?.session;
      if (!session?.user) throw new Error('Sessione di invito non disponibile');

      window.history.replaceState({}, document.title, 'imposta-password.html');
      return session.user;
    }

    function showPasswordAlert(message) {
      const alert = document.createElement('div');
      alert.className = 'alert alert-danger';
      alert.textContent = String(message || 'Impossibile salvare la password');
      document.getElementById('alertBox').replaceChildren(alert);
    }

    function resetSaveButton() {
      document.getElementById('btnSavePassword').disabled = false;
      document.getElementById('btnSaveText').classList.remove('hidden');
      document.getElementById('btnSaveSpinner').classList.add('hidden');
    }

    async function initializeInvite() {
      try {
        const user = await resolveInviteSession();
        document.getElementById('accountEmail').textContent = user.email || 'Account Mirox CRM';
        loadingPanel.classList.add('hidden');
        passwordPanel.classList.remove('hidden');
        document.getElementById('newPassword').focus();
      } catch (error) {
        loadingPanel.classList.add('hidden');
        invalidPanel.classList.remove('hidden');
        document.getElementById('invalidMessage').textContent = error?.message || 'Il link e\' scaduto o non e\' valido. Richiedi un nuovo invito.';
      }
    }

    document.getElementById('passwordForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (password.length < 12) {
        showPasswordAlert('La password deve contenere almeno 12 caratteri');
        return;
      }
      if (password !== confirmation) {
        showPasswordAlert('Le due password non coincidono');
        return;
      }

      const button = document.getElementById('btnSavePassword');
      button.disabled = true;
      document.getElementById('btnSaveText').classList.add('hidden');
      document.getElementById('btnSaveSpinner').classList.remove('hidden');

      try {
        const { error } = await db.auth.updateUser({ password });
        if (error) throw error;
        await db.auth.signOut();
        window.location.replace('index.html?password_updated=1');
      } catch (error) {
        showPasswordAlert(error?.message || 'Impossibile salvare la password');
        resetSaveButton();
      }
    });

    initializeInvite();
  </script>
</body>
</html>
