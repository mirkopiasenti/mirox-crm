name: Guardian staging tests

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Guardian execution UUID
        required: true
        type: string
      requested_type:
        description: Execution type supplied by the dispatcher
        required: true
        type: string
      target_environment:
        description: Guardian environment that owns the execution
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: guardian-codex-${{ inputs.execution_id }}
  cancel-in-progress: false

jobs:
  test:
    if: startsWith(github.ref, 'refs/heads/codex/kg-') && inputs.requested_type == 'test_staging' && (inputs.target_environment == 'staging' || inputs.target_environment == 'production')
    environment: ${{ inputs.target_environment == 'production' && 'guardian-production' || 'guardian-staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GUARDIAN_WORKER_URL: ${{ secrets.GUARDIAN_WORKER_URL }}
      GUARDIAN_WORKER_SECRET: ${{ secrets.GUARDIAN_WORKER_SECRET }}
      EXECUTION_ID: ${{ inputs.execution_id }}
      STAGING_URL: https://mirox-crm-staging.netlify.app

    steps:
      - name: Checkout requested patch branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Claim Guardian execution
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GUARDIAN_WORKER_URL"
          test -n "$GUARDIAN_WORKER_SECRET"
          body="$(jq -cn --arg id "$EXECUTION_ID" --arg run "${GITHUB_RUN_ID}" '{action:"claim",execution_id:$id,workflow_run_id:($run|tonumber)}')"
          signature="$(BODY="$body" node -e 'const crypto=require("crypto"); process.stdout.write(crypto.createHmac("sha256", process.env.GUARDIAN_WORKER_SECRET).update(process.env.BODY).digest("hex"))')"
          response="$(curl --fail --silent --show-error --max-time 20 "$GUARDIAN_WORKER_URL" -H 'Content-Type: application/json' -H "X-Guardian-Worker-Signature: $signature" --data "$body")"
          lease="$(jq -er '.lease_token' <<<"$response")"
          echo "::add-mask::$lease"
          echo "lease_token=$lease" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Run repository tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Check staging is reachable
        id: smoke
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 20 "$STAGING_URL/"

      - name: Return staging test result to Guardian
        if: always() && steps.claim.outputs.lease_token != ''
        shell: bash
        env:
          LEASE_TOKEN: ${{ steps.claim.outputs.lease_token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          success=false
          if [ "$INSTALL_OUTCOME" = "success" ] && [ "$TEST_OUTCOME" = "success" ] && [ "$SMOKE_OUTCOME" = "success" ]; then success=true; fi
          summary="Test repository: $TEST_OUTCOME. Smoke staging: $SMOKE_OUTCOME."
          body="$(jq -cn --arg id "$EXECUTION_ID" --arg lease "$LEASE_TOKEN" --arg summary "$summary" --arg install "$INSTALL_OUTCOME" --arg tests "$TEST_OUTCOME" --arg smoke "$SMOKE_OUTCOME" --argjson success "$success" '{action:"result",execution_id:$id,lease_token:$lease,success:$success,summary:$summary,result:{install:$install,tests:$tests,smoke:$smoke}}')"
          if [ "$success" != true ]; then body="$(jq -c --arg error_code "staging_tests_failed" --arg error "$summary" '. + {error_code:$error_code,error:$error}' <<<"$body")"; fi
          signature="$(BODY="$body" node -e 'const crypto=require("crypto"); process.stdout.write(crypto.createHmac("sha256", process.env.GUARDIAN_WORKER_SECRET).update(process.env.BODY).digest("hex"))')"
          curl --fail --silent --show-error --max-time 20 "$GUARDIAN_WORKER_URL" -H 'Content-Type: application/json' -H "X-Guardian-Worker-Signature: $signature" --data "$body" >/dev/null
