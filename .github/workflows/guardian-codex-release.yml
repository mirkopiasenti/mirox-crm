name: Guardian approved production publication

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Guardian execution UUID
        required: true
        type: string
      requested_type:
        description: Execution type supplied by the dispatcher
        required: true
        type: string
      target_environment:
        description: Guardian environment that owns the execution
        required: true
        type: choice
        options:
          - production

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: guardian-codex-${{ inputs.execution_id }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.requested_type == 'rilascio_produzione' && inputs.target_environment == 'production'
    environment: guardian-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GUARDIAN_WORKER_URL: ${{ secrets.GUARDIAN_WORKER_URL }}
      GUARDIAN_WORKER_SECRET: ${{ secrets.GUARDIAN_WORKER_SECRET }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      EXECUTION_ID: ${{ inputs.execution_id }}

    steps:
      - name: Checkout trusted production workflow
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish approved and tested version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/codex/guardian-publish.js
