# =============================================================================
# Mirox CRM - Configurazione Netlify
# =============================================================================

[build]
  command    = "npm run build"
  publish    = "dist"
  functions  = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_templates/disdette/*.pdf"]
  # External modules che non vanno bundlati.
  # pdfkit: ha font AFM e asset binari interni che esbuild non riesce a
  #   bundlare correttamente (a runtime fallirebbe con ENOENT su Helvetica.afm).
  external_node_modules = ["@supabase/supabase-js", "nodemailer", "pdfkit"]

# Headers di sicurezza statici. La CSP e' generata in dist/_headers dalla build,
# cosi' consente esclusivamente il progetto Supabase dell'ambiente corrente.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# =============================================================================
# Scheduled functions
# =============================================================================
# cron-rientro-sim — invia mail giornaliera a info@konatech.it per ogni
# pratica Switch SIM con giorno_rientro = oggi e non già notificata.
# Lo schedule è dichiarato anche nel codice della function (module.exports.schedule),
# ma lo replico qui per chiarezza.
[functions."cron-rientro-sim"]
  schedule = "0 7 * * *"

# Pulizia OTP scaduti, rate limit e pratiche vendita bozza oltre 24 ore.
[functions."cron-pulizia-operativa"]
  schedule = "30 2 * * *"

# KONA AI Guardian Observer — aggrega telemetria, avvia analisi read-only e
# processa la coda Telegram. Tutte le azioni di scrittura restano approvate da Mirko.
[functions."cron-guardian-observer"]
  schedule = "*/5 * * * *"

# KONA Call Director — dispatcher idempotente ogni 5 minuti (orologio Rome,
# eventi giornalieri data+evento, job a lease, coda notifiche Telegram).
# Nasce disattivato: opera solo se KONA_CALL_DIRECTOR_ENABLED != false e
# kona_call_director_config.attivo_globale=true.
[functions."kona-call-director-dispatcher"]
  schedule = "*/5 * * * *"
