# =============================================================================
# Mirox CRM - Configurazione Netlify
# =============================================================================

[build]
  publish    = "."
  functions  = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # External modules che non vanno bundlati.
  # pdfkit: ha font AFM e asset binari interni che esbuild non riesce a
  #   bundlare correttamente (a runtime fallirebbe con ENOENT su Helvetica.afm).
  external_node_modules = ["@supabase/supabase-js", "nodemailer", "pdfkit"]

# Headers di sicurezza. La CSP mantiene temporaneamente 'unsafe-inline' per
# compatibilita' con gli script e gli handler inline delle pagine statiche;
# le sorgenti di rete restano comunque limitate all'allowlist dichiarata.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Content-Security-Policy  = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://lbgwamhjkjjfwgusafbi.supabase.co https://script.google.com https://script.googleusercontent.com; connect-src 'self' https://lbgwamhjkjjfwgusafbi.supabase.co wss://lbgwamhjkjjfwgusafbi.supabase.co https://script.google.com https://script.googleusercontent.com; frame-src 'self' blob: https://lbgwamhjkjjfwgusafbi.supabase.co; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"

# =============================================================================
# Scheduled functions
# =============================================================================
# cron-rientro-sim — invia mail giornaliera a info@konatech.it per ogni
# pratica Switch SIM con giorno_rientro = oggi e non già notificata.
# Lo schedule è dichiarato anche nel codice della function (module.exports.schedule),
# ma lo replico qui per chiarezza.
[functions."cron-rientro-sim"]
  schedule = "0 7 * * *"

# Pulizia OTP scaduti, rate limit e pratiche vendita bozza oltre 24 ore.
[functions."cron-pulizia-operativa"]
  schedule = "30 2 * * *"
